<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f8e7c9"><title>Croissant Rush 2.0</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#533020}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none}body{background:#f9ebd3}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:2;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;display:flex;gap:9px;align-items:stretch;pointer-events:none}.pill{background:#fff9e9ee;border:2px solid #d9ae78;border-radius:17px;box-shadow:0 5px 0 #c99b6d55,0 7px 18px #653b2520;padding:8px 13px;min-width:0;flex:1}.pill small{display:block;color:#9a6b49;font-size:10px;letter-spacing:1.2px;font-weight:900}.pill strong{font-size:22px;font-weight:1000;line-height:1.15}.pill.life{flex:0 0 auto;text-align:center}.pill.life strong{font-size:22px;letter-spacing:1px}.modalwrap{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#44251a88;backdrop-filter:blur(5px)}.modal{width:min(440px,100%);border-radius:30px;background:#fff7e7;border:4px solid #d8a367;box-shadow:0 13px 0 #9b633f,0 24px 60px #2b130b88;padding:26px 22px 28px;text-align:center;position:relative}.logo{font-size:57px;filter:drop-shadow(0 5px 2px #c68b5455);line-height:1.1}.modal h1{font-size:clamp(32px,9vw,49px);line-height:1;margin:10px 0 6px;color:#69371f;letter-spacing:-2px;text-shadow:0 3px #e8bd86}.modal p{font-size:16px;line-height:1.5;color:#7b5339;margin:10px 0 22px}.modal .scoreline{font-weight:900;color:#754224;font-size:21px;margin:14px 0}button{border:0;border-radius:18px;padding:16px 30px;font:1000 20px system-ui;color:#fff9e9;background:linear-gradient(#ae642f,#79401e);box-shadow:0 6px 0 #54280f,0 10px 18px #65351e44;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(4px);box-shadow:0 2px 0 #54280f}.hidden{display:none}.hint{font-size:12px;color:#aa815e;margin-top:20px}.bottom{position:fixed;z-index:2;bottom:calc(env(safe-area-inset-bottom) + 13px);left:0;right:0;text-align:center;pointer-events:none;font-size:12px;font-weight:900;letter-spacing:1.4px;color:#9d6945;text-shadow:0 1px #fff6e5}.sound{position:fixed;right:17px;bottom:calc(env(safe-area-inset-bottom) + 38px);z-index:3;border:2px solid #c79a6e;background:#fff7e6d9;border-radius:14px;font-size:20px;padding:8px;box-shadow:none;color:#693b26;line-height:1;pointer-events:auto}@media(max-width:360px){.hud{left:8px;right:8px;gap:5px}.pill{padding:8px}.pill strong{font-size:18px}.pill.life strong{font-size:17px}}
</style></head><body>
<canvas id="game" aria-label="Croissants antippen und mit Haselnusscreme bestreichen"></canvas>
<div class="hud"><div class="pill"><small>PUNKTE</small><strong id="score">0</strong></div><div class="pill"><small>BESTWERT</small><strong id="best">0</strong></div><div class="pill life"><small>VERPASST</small><strong id="lives">♡ ♡ ♡</strong></div></div>
<button class="sound" id="sound" aria-label="Ton an oder aus">♪</button><div class="bottom">TIPP DIE CROISSANTS! · +10 PUNKTE</div>
<div class="modalwrap" id="overlay"><div class="modal"><div class="logo">🥐🍫</div><h1 id="heading">CROISSANT<br>RUSH!</h1><p id="message">Frisch aus der Bäckerei! Bestreiche die fallenden Croissants mit Haselnusscreme. Drei verpasste Croissants und die Runde ist vorbei.</p><div id="result" class="scoreline hidden"></div><button id="play">LOS GEHT'S!</button><div class="hint">Tippen oder klicken · Combos bringen Bonuspunkte</div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay'),heading=document.getElementById('heading'),message=document.getElementById('message'),result=document.getElementById('result'),play=document.getElementById('play'),soundBtn=document.getElementById('sound');
let W=0,H=0,dpr=1,now=0,last=0,active=false,score=0,misses=0,combo=0,elapsed=0,spawnClock=0,items=[],particles=[],floaters=[],audio=null,sound=true,shake=0;
let best=0;try{best=Number(localStorage.getItem('croissant-rush-best-v2')||localStorage.getItem('croissant-rush-best')||0)}catch(e){}bestEl.textContent=best;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function tone(freq=420,duration=.1,type='sine',vol=.08){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.6),audio.currentTime+duration);gain.gain.setValueAtTime(vol,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch(e){}}
soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'♪':'♪̸';if(sound)tone(600)};
// Detailed hand-drawn pastry sprite, cached at high resolution for fast mobile rendering.
const sprite=document.createElement('canvas');sprite.width=440;sprite.height=300;const s=sprite.getContext('2d');
function path(points){s.beginPath();s.moveTo(...points[0]);for(let i=1;i<points.length;i++)s.bezierCurveTo(...points[i]);s.closePath()}
function drawPastry(){s.clearRect(0,0,440,300);s.save();s.shadowColor='#5e2a0e88';s.shadowBlur=15;s.shadowOffsetY=10;
const base=s.createLinearGradient(65,55,325,255);base.addColorStop(0,'#ffe7a0');base.addColorStop(.26,'#eaa548');base.addColorStop(.56,'#bd6529');base.addColorStop(.8,'#d88b35');base.addColorStop(1,'#8e401b');
s.beginPath();s.moveTo(35,210);s.bezierCurveTo(65,108,116,57,181,65);s.bezierCurveTo(248,20,318,60,356,125);s.bezierCurveTo(387,168,403,193,418,192);s.bezierCurveTo(404,246,364,258,325,227);s.bezierCurveTo(266,263,174,267,109,223);s.bezierCurveTo(76,251,47,242,35,210);s.closePath();s.fillStyle=base;s.fill();s.shadowColor='transparent';s.lineWidth=8;s.strokeStyle='#93491f';s.stroke();
// Flaky folded pastry segments
const folds=[
['#cf752c',[[87,107],[115,75,144,65,176,67],[163,120,152,168,118,219],[94,222,70,190,87,107]]],
['#eaa44d',[[161,72],[198,46,236,52,265,77],[247,124,237,177,214,246],[174,243,138,209,161,72]]],
['#d17a2e',[[261,74],[305,75,334,103,351,137],[336,180,316,215,292,235],[254,209,239,154,261,74]]]
];
for(const [color,p] of folds){s.beginPath();s.moveTo(...p[0]);for(let i=1;i<p.length;i++)s.bezierCurveTo(...p[i]);s.closePath();const gr=s.createLinearGradient(0,65,0,245);gr.addColorStop(0,'#ffdb81');gr.addColorStop(.42,color);gr.addColorStop(.82,'#ad531e');gr.addColorStop(1,'#e8a24d');s.fillStyle=gr;s.fill();s.strokeStyle='#9b4b1c';s.lineWidth=5;s.stroke();}
// curved fine lamination and toasted details
s.lineCap='round';for(let j=0;j<3;j++){const x=112+j*79;s.beginPath();s.moveTo(x+15,91);s.bezierCurveTo(x-1,131,x-2,172,x-12,205);s.strokeStyle='#ffe5a0a8';s.lineWidth=7;s.stroke();s.beginPath();s.moveTo(x+29,104);s.bezierCurveTo(x+12,146,x+11,171,x+2,204);s.strokeStyle='#7b361a88';s.lineWidth=4;s.stroke()}
let seed=17;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}for(let i=0;i<170;i++){let x=45+rnd()*345,y=66+rnd()*170;if(((x-215)/196)**2+((y-159)/105)**2>1)continue;s.beginPath();s.ellipse(x,y,rand(.6,2.3),rand(.5,1.6),rnd()*3,0,Math.PI*2);s.fillStyle=rnd()>.45?'#fff0b18c':'#8a3e1d66';s.fill()}
s.restore()}
drawPastry();
function bg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#f9e9cb');g.addColorStop(1,'#f1cfa3');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.save();ctx.globalAlpha=.14;ctx.strokeStyle='#bc8959';ctx.lineWidth=2;for(let y=135;y<H;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=40;x<W;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.restore();
ctx.fillStyle='#b17a4e';ctx.fillRect(0,H-27,W,27);ctx.fillStyle='#fff0d1';ctx.fillRect(0,H-34,W,9);ctx.fillStyle='#815032';ctx.fillRect(0,H-18,W,18);
// Bakery awning
ctx.fillStyle='#b76d49';ctx.fillRect(0,0,W,9);for(let x=0;x<W;x+=42){ctx.fillStyle=Math.floor(x/42)%2?'#fff3d7':'#c77b56';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+42,0);ctx.lineTo(x+42,22);ctx.quadraticCurveTo(x+21,41,x,22);ctx.closePath();ctx.fill()}}
function spawn(){let r=clamp(Math.min(W*.15,68),37,65),x=rand(r+7,Math.max(r+8,W-r-7));let speed=(115+elapsed*3.9)*rand(.85,1.15);items.push({x,y:-r*1.8,r,speed,rot:rand(-.4,.4),spin:rand(-.8,.8),sway:rand(10,25),phase:rand(0,7),state:'fall',hit:0,scale:1})}
function puff(x,y,color,n=15){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(70,260);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-55,r:rand(2,7),life:rand(.35,.75),max:.75,color})}}
function floatText(x,y,label,color='#fff7d7'){floaters.push({x,y,label,color,life:1})}
function hit(x,y){if(!active)return;for(let i=items.length-1;i>=0;i--){const c=items[i];if(c.state!=='fall')continue;const dx=x-c.x,dy=y-c.y;if((dx/(c.r*1.17))**2+(dy/(c.r*.77))**2<1.3){c.state='coated';c.hit=0;combo++;const bonus=combo>0&&combo%5===0?25:0;score+=10+bonus;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('croissant-rush-best-v2',String(best))}catch(e){}}puff(c.x,c.y,'#7d3e23',18);puff(c.x,c.y,'#d9a05b',7);floatText(c.x,c.y-c.r*.6,bonus?'+35 COMBO!':'+10',bonus?'#f6bc3f':'#fff5d9');tone(bonus?800:420+Math.min(combo,12)*26,.12,'triangle',.09);return}}}
function update(dt){if(!active)return;elapsed+=dt;spawnClock-=dt;const interval=Math.max(.32,1.23-elapsed*.011);if(spawnClock<=0){spawn();spawnClock=interval*rand(.78,1.18)}for(let i=items.length-1;i>=0;i--){const c=items[i];if(c.state==='fall'){c.y+=c.speed*dt;c.x+=Math.sin(elapsed*2+c.phase)*c.sway*dt;c.x=clamp(c.x,c.r*.6,W-c.r*.6);c.rot+=c.spin*dt;if(c.y-c.r*.45>H-32){items.splice(i,1);misses++;combo=0;shake=10;floatText(c.x,H-100,'VERPASST!','#9c3b2b');tone(155,.25,'sawtooth',.07);livesEl.textContent=Array.from({length:3},(_,j)=>j<misses?'♥':'♡').join(' ');if(misses>=3){finish();return}}}else{c.hit+=dt;c.y+=c.speed*dt*.32;c.rot+=c.spin*dt*.3;if(c.hit>.56)items.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=460*dt;if(p.life<=0)particles.splice(i,1)}for(let i=floaters.length-1;i>=0;i--){floaters[i].life-=dt;floaters[i].y-=55*dt;if(floaters[i].life<=0)floaters.splice(i,1)}shake=Math.max(0,shake-35*dt)}
function croissant(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot+Math.sin(elapsed*2+c.phase)*.08);let sc=c.r/190;if(c.state==='coated')sc*=1+Math.sin(Math.min(1,c.hit/.56)*Math.PI)*.16;ctx.scale(sc,sc);ctx.drawImage(sprite,-220,-150,440,300);
if(c.state==='coated'){let t=clamp(c.hit/.34,0,1);ctx.save();ctx.beginPath();ctx.ellipse(0,12,173*t,91*t,-.1,0,Math.PI*2);ctx.clip();const choc=ctx.createLinearGradient(-70,-85,90,115);choc.addColorStop(0,'#a86a3d');choc.addColorStop(.4,'#68341f');choc.addColorStop(.7,'#4c2418');choc.addColorStop(1,'#b57a46');ctx.fillStyle=choc;ctx.beginPath();ctx.ellipse(0,15,175,94,-.1,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e0a36a';ctx.lineWidth=11;ctx.lineCap='round';for(let j=0;j<4;j++){ctx.beginPath();ctx.moveTo(-110+j*55,-32);ctx.quadraticCurveTo(-60+j*55,20,-100+j*55,55);ctx.stroke()}ctx.restore();ctx.globalAlpha=clamp((.56-c.hit)/.24,0,1)}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));bg();for(const c of items)croissant(c);for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of floaters){ctx.globalAlpha=clamp(f.life*2,0,1);ctx.textAlign='center';ctx.font='1000 23px system-ui';ctx.lineWidth=5;ctx.strokeStyle='#6c3b27';ctx.strokeText(f.label,f.x,f.y);ctx.fillStyle=f.color;ctx.fillText(f.label,f.x,f.y)}ctx.restore()}
function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function start(){score=0;misses=0;combo=0;elapsed=0;spawnClock=.35;items=[];particles=[];floaters=[];shake=0;scoreEl.textContent=0;livesEl.textContent='♡ ♡ ♡';active=true;overlay.classList.add('hidden');tone(650,.13)}
function finish(){active=false;heading.innerHTML='GAME<br>OVER!';message.textContent=score>=best&&score>0?'Neuer Bestwert! Du bist ein echter Croissant-Profi.':'Die Bäckerei braucht dich für die nächste Runde!';result.textContent=`${score} Punkte · Bestwert ${best}`;result.classList.remove('hidden');play.textContent='NOCHMAL SPIELEN';overlay.classList.remove('hidden')}
play.addEventListener('click',start);canvas.addEventListener('pointerdown',e=>{e.preventDefault();hit(e.clientX,e.clientY)},{passive:false});document.addEventListener('visibilitychange',()=>{last=performance.now()});
})();
</script></body></html>
