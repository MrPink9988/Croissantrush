<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff0d4"><title>Croissant Rush 🥐</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif;background:#fff0d4;color:#50301f}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;pointer-events:none;gap:8px} .stat{background:#fff9eddf;border:2px solid #e9c28b;border-radius:18px;padding:8px 12px;text-align:center;box-shadow:0 4px 0 #b47b4a33;min-width:82px}.stat small{display:block;font-weight:800;font-size:10px;letter-spacing:.08em}.stat b{font-size:24px}#hearts{font-size:23px;white-space:nowrap}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#45200d78;padding:22px}#overlay.hidden{display:none}.panel{width:min(420px,100%);background:#fff9ed;border:4px solid #b97b46;border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 12px 0 #4c241a40}.mascot{font-size:72px;line-height:1.2}h1{font-size:clamp(32px,9vw,46px);margin:10px 0;color:#81451f}p{font-size:16px;line-height:1.5}button{border:0;border-radius:18px;background:#7d391c;color:white;font-weight:900;font-size:21px;padding:16px 35px;box-shadow:0 6px 0 #48200e;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(4px);box-shadow:0 2px 0 #48200e}.hint{font-size:13px;color:#8c6c56;margin-top:20px}#toast{position:fixed;top:110px;width:100%;text-align:center;font-weight:900;color:#88421e;pointer-events:none;opacity:0;transition:opacity .2s}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="stat"><small>PUNKTE</small><b id="score">0</b></div><div class="stat"><small>REKORD</small><b id="best">0</b></div><div class="stat"><small>LEBEN</small><div id="hearts">❤️❤️❤️</div></div></div><div id="toast"></div><div id="overlay"><div class="panel"><div class="mascot">🥐🍫</div><h1 id="heading">Croissant Rush!</h1><p id="message">Bestreiche die fallenden Croissants mit Haselnusscreme! Tippe sie an, bevor sie den Boden erreichen. Drei verpasste Croissants und das Spiel ist vorbei.</p><button id="start">Los geht's!</button><div class="hint">📱 Für Touchscreens und Maus · Highscore wird gespeichert</div></div></div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),hearts=document.querySelector('#hearts'),heading=document.querySelector('#heading'),message=document.querySelector('#message'),start=document.querySelector('#start'),toast=document.querySelector('#toast');let W=0,H=0,dpr=1,items=[],particles=[],score=0,miss=0,elapsed=0,spawn=0,last=0,running=false,best=0;try{best=Number(localStorage.getItem('croissantRushBest'))||0}catch{}bestEl.textContent=best;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const rnd=(a,b)=>a+Math.random()*(b-a);function croissant(x,y,r,angle,cream=false){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(r/54,r/54);ctx.lineJoin='round';ctx.lineCap='round';ctx.fillStyle='#a65c25';ctx.strokeStyle='#81431e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-47,4);ctx.bezierCurveTo(-58,-11,-48,-26,-32,-23);ctx.bezierCurveTo(-21,-42,19,-42,32,-23);ctx.bezierCurveTo(48,-27,58,-12,47,5);ctx.bezierCurveTo(39,14,32,7,27,-2);ctx.bezierCurveTo(9,15,-9,15,-27,-2);ctx.bezierCurveTo(-32,7,-39,14,-47,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#edab50';ctx.beginPath();ctx.moveTo(-39,-15);ctx.bezierCurveTo(-15,-49,15,-49,39,-15);ctx.bezierCurveTo(23,-5,14,2,0,5);ctx.bezierCurveTo(-14,2,-23,-5,-39,-15);ctx.fill();ctx.strokeStyle='#c67b32';ctx.lineWidth=4;for(let s of [-19,0,19]){ctx.beginPath();ctx.moveTo(s-7,-28);ctx.quadraticCurveTo(s-1,-12,s+5,1);ctx.stroke()}if(cream){ctx.fillStyle='#63301e';ctx.beginPath();ctx.moveTo(-35,-12);ctx.bezierCurveTo(-19,-30,-11,-13,0,-23);ctx.bezierCurveTo(13,-34,20,-14,34,-14);ctx.bezierCurveTo(22,-3,13,-6,6,0);ctx.lineTo(1,8);ctx.lineTo(-4,-1);ctx.bezierCurveTo(-17,5,-25,-3,-35,-12);ctx.fill();ctx.fillStyle='#a96a4c';ctx.beginPath();ctx.ellipse(-12,-16,9,3,-.2,0,Math.PI*2);ctx.fill()}ctx.restore()}
function burst(x,y){for(let i=0;i<14;i++)particles.push({x,y,vx:rnd(-180,180),vy:rnd(-200,70),life:rnd(.35,.75),max:.75,size:rnd(3,8),color:Math.random()<.75?'#784025':'#f9c35d'});particles.push({x,y,vy:-85,life:.8,max:.8,text:'+10'})}function updateHud(){scoreEl.textContent=score;bestEl.textContent=best;hearts.textContent='❤️'.repeat(3-miss)+'🖤'.repeat(miss)}function newGame(){items=[];particles=[];score=0;miss=0;elapsed=0;spawn=.4;last=performance.now();running=true;updateHud();overlay.classList.add('hidden')}function endGame(){running=false;heading.textContent=miss>=3?'Croissant-Alarm!':'Croissant Rush!';message.innerHTML=`Du hast <strong>${score} Punkte</strong> gesammelt!<br>${score>=best&&score>0?'🏆 Neuer persönlicher Rekord!':'Dein Rekord: '+best+' Punkte'}`;start.textContent='Nochmal spielen';overlay.classList.remove('hidden')}function hit(x,y){if(!running)return;for(let i=items.length-1;i>=0;i--){let c=items[i];if(Math.hypot(x-c.x,y-c.y)<c.r*1.18){items.splice(i,1);score+=10;if(score>best){best=score;try{localStorage.setItem('croissantRushBest',String(best))}catch{}}burst(c.x,c.y);updateHud();return}}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();hit(e.clientX,e.clientY)},{passive:false});start.addEventListener('click',newGame);function frame(t){let dt=Math.min((t-last)/1000||0,.05);last=t;ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#fff5df');bg.addColorStop(1,'#f4d4a7');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#dfb67e';ctx.fillRect(0,H-24,W,24);ctx.fillStyle='#bf8b54';ctx.fillRect(0,H-24,W,4);if(running){elapsed+=dt;let level=1+elapsed/20;spawn-=dt;if(spawn<=0){let r=Math.max(34,Math.min(52,W*.095));items.push({x:rnd(r+8,Math.max(r+9,W-r-8)),y:-r*1.3,r,vy:(105+elapsed*3.7)*rnd(.88,1.15),angle:rnd(-.35,.35),spin:rnd(-.4,.4)});spawn=Math.max(.28,1.25-Math.min(.94,elapsed*.012))*rnd(.8,1.18)}for(let i=items.length-1;i>=0;i--){let c=items[i];c.y+=c.vy*dt;c.angle+=c.spin*dt;if(c.y-c.r>H-22){items.splice(i,1);miss++;updateHud();if(miss>=3){endGame();break}}}}for(let c of items)croissant(c.x,c.y,c.r,c.angle);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=Math.min(1,p.life/.25);if(p.text){p.y+=p.vy*dt;ctx.font='900 26px system-ui';ctx.textAlign='center';ctx.fillStyle='#743719';ctx.fillText(p.text,p.x,p.y)}else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=350*dt;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
