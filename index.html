<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f8e7c9"><title>Croissant Rush 3.0</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;color:#533020}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none}body{background:#f9ebd3}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:2;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;display:flex;gap:9px;align-items:stretch;pointer-events:none}.pill{background:#fff0d8f2;border:2px solid #d9ae78;border-radius:17px;box-shadow:0 5px 0 #c99b6d55,0 7px 18px #653b2520;padding:8px 13px;min-width:0;flex:1}.pill small{display:block;color:#9a6b49;font-size:10px;letter-spacing:1.2px;font-weight:900}.pill strong{font-size:22px;font-weight:1000;line-height:1.15}.pill.life{flex:0 0 auto;text-align:center}.pill.life strong{font-size:22px;letter-spacing:1px}.modalwrap{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#44251a88;backdrop-filter:blur(5px)}.modal{width:min(440px,100%);border-radius:30px;background:#fff2d9;border:4px solid #d8a367;box-shadow:0 13px 0 #9b633f,0 24px 60px #2b130b88;padding:26px 22px 28px;text-align:center;position:relative}.logo{font-size:57px;filter:drop-shadow(0 5px 2px #c68b5455);line-height:1.1}.modal h1{font-size:clamp(32px,9vw,49px);line-height:1;margin:10px 0 6px;color:#69371f;letter-spacing:-2px;text-shadow:0 3px #e8bd86}.modal p{font-size:16px;line-height:1.5;color:#7b5339;margin:10px 0 22px}.modal .scoreline{font-weight:900;color:#754224;font-size:21px;margin:14px 0}button{border:0;border-radius:18px;padding:16px 30px;font:1000 20px system-ui;color:#fff9e9;background:linear-gradient(#ae642f,#79401e);box-shadow:0 6px 0 #54280f,0 10px 18px #65351e44;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(4px);box-shadow:0 2px 0 #54280f}.hidden{display:none}.hint{font-size:12px;color:#aa815e;margin-top:20px}.bottom{position:fixed;z-index:2;bottom:calc(env(safe-area-inset-bottom) + 13px);left:0;right:0;text-align:center;pointer-events:none;font-size:12px;font-weight:900;letter-spacing:1.4px;color:#9d6945;text-shadow:0 1px #fff6e5}.sound{position:fixed;right:17px;bottom:calc(env(safe-area-inset-bottom) + 38px);z-index:3;border:2px solid #c79a6e;background:#fff7e6d9;border-radius:14px;font-size:20px;padding:8px;box-shadow:none;color:#693b26;line-height:1;pointer-events:auto}@media(max-width:360px){.hud{left:8px;right:8px;gap:5px}.pill{padding:8px}.pill strong{font-size:18px}.pill.life strong{font-size:17px}}
</style></head><body>
<canvas id="game" aria-label="Croissants antippen und mit Haselnusscreme bestreichen"></canvas>
<div class="hud"><div class="pill"><small>PUNKTE</small><strong id="score">0</strong></div><div class="pill"><small>BESTWERT</small><strong id="best">0</strong></div><div class="pill life"><small>VERPASST</small><strong id="lives">♡ ♡ ♡</strong></div></div>
<button class="sound" id="sound" aria-label="Ton an oder aus">♪</button><div class="bottom">CROISSANTS MIT SCHOKOCREME BESTREICHEN · +10</div>
<div class="modalwrap" id="overlay"><div class="modal"><div class="logo">🥐🍫</div><h1 id="heading">CROISSANT<br>RUSH!</h1><p id="message">Willkommen in der Pariser Pâtisserie! Bestreiche die fallenden Croissants mit Haselnusscreme. Drei verpasste Croissants und die Runde ist vorbei.</p><div id="result" class="scoreline hidden"></div><button id="play">LOS GEHT'S!</button><div class="hint">Tippen oder klicken · Combos bringen Bonuspunkte</div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),overlay=document.getElementById('overlay'),heading=document.getElementById('heading'),message=document.getElementById('message'),result=document.getElementById('result'),play=document.getElementById('play'),soundBtn=document.getElementById('sound');
let W=0,H=0,dpr=1,now=0,last=0,active=false,score=0,misses=0,combo=0,elapsed=0,spawnClock=0,items=[],particles=[],floaters=[],audio=null,sound=true,shake=0;
let best=0;try{best=Number(localStorage.getItem('croissant-rush-best-v3')||localStorage.getItem('croissant-rush-best-v2')||localStorage.getItem('croissant-rush-best')||0)}catch(e){}bestEl.textContent=best;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function tone(freq=420,duration=.1,type='sine',vol=.08){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.6),audio.currentTime+duration);gain.gain.setValueAtTime(vol,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration)}catch(e){}}
soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?'♪':'♪̸';if(sound)tone(600)};
// Art-directed 3D assets from the approved visual concept.
const frames=Array.from({length:5},(_,i)=>{const im=new Image();im.src=`assets/croissant-${i}.png`;return im});
const bakery=new Image();bakery.src='assets/bakery.jpg';
function bg(){
 if(bakery.complete&&bakery.naturalWidth){const iw=bakery.naturalWidth,ih=bakery.naturalHeight,scale=Math.max(W/iw,H/ih),dw=iw*scale,dh=ih*scale;ctx.drawImage(bakery,(W-dw)/2,(H-dh)/2,dw,dh)}else{ctx.fillStyle='#f6dfbd';ctx.fillRect(0,0,W,H)}
 ctx.fillStyle='#fff2db25';ctx.fillRect(0,0,W,H);
 const shade=ctx.createLinearGradient(0,0,0,H);shade.addColorStop(0,'#fff3da55');shade.addColorStop(.35,'#ffffff05');shade.addColorStop(1,'#4923106b');ctx.fillStyle=shade;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#4c261caa';ctx.fillRect(0,H-21,W,21);
}
function spawn(){let r=clamp(Math.min(W*.15,68),37,65),x=rand(r+7,Math.max(r+8,W-r-7));let speed=(115+elapsed*3.9)*rand(.85,1.15);items.push({x,y:-r*1.8,r,speed,rot:rand(-.4,.4),spin:rand(-.8,.8),sway:rand(10,25),phase:rand(0,7),state:'fall',hit:0,scale:1})}
function puff(x,y,color,n=15){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(70,260);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-55,r:rand(2,7),life:rand(.35,.75),max:.75,color})}}
function floatText(x,y,label,color='#fff7d7'){floaters.push({x,y,label,color,life:1})}
function hit(x,y){if(!active)return;for(let i=items.length-1;i>=0;i--){const c=items[i];if(c.state!=='fall')continue;const dx=x-c.x,dy=y-c.y;if((dx/(c.r*1.17))**2+(dy/(c.r*.77))**2<1.3){c.state='coated';c.hit=0;combo++;const bonus=combo>0&&combo%5===0?25:0;score+=10+bonus;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('croissant-rush-best-v3',String(best))}catch(e){}}puff(c.x,c.y,'#7d3e23',18);puff(c.x,c.y,'#d9a05b',7);floatText(c.x,c.y-c.r*.6,bonus?'+35 COMBO!':'+10',bonus?'#f6bc3f':'#fff5d9');tone(bonus?800:420+Math.min(combo,12)*26,.12,'triangle',.09);return}}}
function update(dt){if(!active)return;elapsed+=dt;spawnClock-=dt;const interval=Math.max(.32,1.23-elapsed*.011);if(spawnClock<=0){spawn();spawnClock=interval*rand(.78,1.18)}for(let i=items.length-1;i>=0;i--){const c=items[i];if(c.state==='fall'){c.y+=c.speed*dt;c.x+=Math.sin(elapsed*2+c.phase)*c.sway*dt;c.x=clamp(c.x,c.r*.6,W-c.r*.6);c.rot+=c.spin*dt;if(c.y-c.r*.45>H-32){items.splice(i,1);misses++;combo=0;shake=10;floatText(c.x,H-100,'VERPASST!','#9c3b2b');tone(155,.25,'sawtooth',.07);livesEl.textContent=Array.from({length:3},(_,j)=>j<misses?'♥':'♡').join(' ');if(misses>=3){finish();return}}}else{c.hit+=dt;c.y+=c.speed*dt*.32;c.rot+=c.spin*dt*.3;if(c.hit>.56)items.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=460*dt;if(p.life<=0)particles.splice(i,1)}for(let i=floaters.length-1;i>=0;i--){floaters[i].life-=dt;floaters[i].y-=55*dt;if(floaters[i].life<=0)floaters.splice(i,1)}shake=Math.max(0,shake-35*dt)}
function croissant(c){
 ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot*.5+Math.sin(elapsed*2+c.phase)*.09);
 const t=c.state==='coated'?clamp(c.hit/.52,0,1):0;
 const frame=c.state==='coated'?Math.min(4,Math.floor(t*5)):0;
 const im=frames[frame];const w=c.r*2.55,h=c.r*2.25;
 const pop=c.state==='coated'?1+.12*Math.sin(t*Math.PI):1;
 ctx.scale(pop,pop);
 ctx.shadowColor='#40200f88';ctx.shadowBlur=16;ctx.shadowOffsetY=8;
 if(im.complete&&im.naturalWidth)ctx.drawImage(im,-w/2,-h/2,w,h);
 else{ctx.fillStyle='#c77a2f';ctx.beginPath();ctx.ellipse(0,0,w*.42,h*.36,0,0,Math.PI*2);ctx.fill()}
 ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));bg();for(const c of items)croissant(c);for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of floaters){ctx.globalAlpha=clamp(f.life*2,0,1);ctx.textAlign='center';ctx.font='1000 23px system-ui';ctx.lineWidth=5;ctx.strokeStyle='#6c3b27';ctx.strokeText(f.label,f.x,f.y);ctx.fillStyle=f.color;ctx.fillText(f.label,f.x,f.y)}ctx.restore()}
function loop(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function start(){score=0;misses=0;combo=0;elapsed=0;spawnClock=.35;items=[];particles=[];floaters=[];shake=0;scoreEl.textContent=0;livesEl.textContent='♡ ♡ ♡';active=true;overlay.classList.add('hidden');tone(650,.13)}
function finish(){active=false;heading.innerHTML='GAME<br>OVER!';message.textContent=score>=best&&score>0?'Neuer Bestwert! Du bist ein echter Croissant-Profi.':'Die Bäckerei braucht dich für die nächste Runde!';result.textContent=`${score} Punkte · Bestwert ${best}`;result.classList.remove('hidden');play.textContent='NOCHMAL SPIELEN';overlay.classList.remove('hidden')}
play.addEventListener('click',start);canvas.addEventListener('pointerdown',e=>{e.preventDefault();hit(e.clientX,e.clientY)},{passive:false});document.addEventListener('visibilitychange',()=>{last=performance.now()});
})();
</script></body></html>
